
name: Deploy FoodeeJewdee

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check package versions
        run: |
          echo "BUILDING COMMIT:"
          git rev-parse HEAD
          echo "ESBUILD VERSION:"
          node -p "require('./package.json').devDependencies.esbuild"
          echo "VITE VERSION:"
          node -p "require('./package.json').dependencies.vite"

      - name: Install dependencies
        run: npm install

      - name: Build website
        run: npm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy website
        uses: actions/deploy-pages@v4
